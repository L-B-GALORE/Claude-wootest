# GitHub Actions Workflow: Deploy Backend to Cloudflare Workers (DEPRECATED)
#
# ⚠️ DEPRECATED: This workflow is deprecated in favor of:
# - deploy-staging.yml (for staging branch)
# - deploy-production.yml (for main branch)
#
# This workflow is kept for manual deployments only.
# Use deploy-staging.yml or deploy-production.yml for automated deployments.

name: Deploy Backend to Cloudflare Workers (Legacy)

on:
  workflow_dispatch: # Manual triggering only

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Push Database Schema
        working-directory: backend
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy --env production

      - name: Deployment Summary
        run: |
          echo "✅ Backend Worker deployed successfully!"
          echo "🌐 Worker URL: https://claude-wootestnew-api.lilboo.workers.dev"

# GitHub Actions Workflow: Deploy Frontend to Cloudflare Pages (DEPRECATED)
#
# ⚠️ DEPRECATED: This workflow is deprecated in favor of:
# - deploy-staging.yml (for staging branch)
# - deploy-production.yml (for main branch)
#
# This workflow is kept for manual deployments only.
# Use deploy-staging.yml or deploy-production.yml for automated deployments.

name: Deploy Frontend to Cloudflare Pages (Legacy)

on:
  workflow_dispatch: # Manual triggering only

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://claude-wootestnew-api.lilboo.workers.dev

      - name: Create Pages project if not exists
        continue-on-error: true
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/accounts/f09bbb81e8be554d6e67b5de063d8925/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"claude-wootestnew","production_branch":"main"}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f09bbb81e8be554d6e67b5de063d8925
          command: pages deploy frontend/dist --project-name=claude-wootestnew --branch=${{ github.ref_name }}

      - name: Deployment Summary
        run: |
          echo "✅ Frontend deployed successfully!"
          echo "🌐 Pages URL: https://claude-wootestnew.pages.dev"

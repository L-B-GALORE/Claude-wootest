# Cloudflare Workers Configuration
#
# This file defines the configuration for the Cloudflare Workers backend.
# It includes bindings for KV (cache), R2 (storage), Durable Objects (WebSockets),
# and environment variables.
#
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/

# Base configuration (shared across all environments)
name = "claude-wootestnew-api"
main = "src/index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]
account_id = "f09bbb81e8be554d6e67b5de063d8925"

# Worker configuration
workers_dev = false

# Durable Objects (for WebSocket connections per company)
[[durable_objects.bindings]]
name = "COMPANY_ROOM"
class_name = "CompanyRoom"
script_name = "claude-wootestnew-api"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CompanyRoom"]

# ============================================================================
# STAGING ENVIRONMENT
# ============================================================================
[env.staging]
name = "claude-wootestnew-api-staging"
workers_dev = true

# KV Namespaces (staging)
[[env.staging.kv_namespaces]]
binding = "PRESENCE_KV"
id = "9227dd80d6104081855d9dc72f30c357"

[[env.staging.kv_namespaces]]
binding = "CACHE_KV"
id = "7800e46f36b54a7c9cea6a73dbf611a3"

# R2 Buckets (staging)
[[env.staging.r2_buckets]]
binding = "MEDIA_STORAGE"
bucket_name = "claude-wootest-staging"

# Environment variables (staging)
[env.staging.vars]
ENVIRONMENT = "staging"
FRONTEND_URL = "https://staging.claude-wootestnew.pages.dev"

# Durable Objects (staging)
[[env.staging.durable_objects.bindings]]
name = "COMPANY_ROOM"
class_name = "CompanyRoom"
script_name = "claude-wootestnew-api-staging"

# ============================================================================
# PRODUCTION ENVIRONMENT
# ============================================================================
[env.production]
name = "claude-wootestnew-api"
workers_dev = true

# KV Namespaces (production)
[[env.production.kv_namespaces]]
binding = "PRESENCE_KV"
id = "c0d205f35d3745b68b452282773ef17e"

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "1f5c5cc1d566466f8a9cabacdfd08f58"

# R2 Buckets (production)
[[env.production.r2_buckets]]
binding = "MEDIA_STORAGE"
bucket_name = "customer-service-media"

# Environment variables (production)
[env.production.vars]
ENVIRONMENT = "production"

# Durable Objects (production)
[[env.production.durable_objects.bindings]]
name = "COMPANY_ROOM"
class_name = "CompanyRoom"
script_name = "claude-wootestnew-api"

# ============================================================================
# SECRETS (Set via GitHub Actions or wrangler secret put)
# ============================================================================
# - DATABASE_URL (Neon Postgres connection string)
# - JWT_SECRET (for signing JWT tokens)
# - ENCRYPTION_KEY (for encrypting provider credentials)

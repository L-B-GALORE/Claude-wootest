<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twilio Browser Phone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Setup Screen -->
    <div id="setup-screen" class="screen">
        <div class="container">
            <h1>📞 Twilio Browser Phone Setup</h1>
            <p>Enter your Twilio credentials to initialize the app</p>
            <form id="setup-form">
                <div class="form-group">
                    <label for="accountSid">Account SID</label>
                    <input type="text" id="accountSid" placeholder="ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label for="authToken">Auth Token</label>
                    <input type="password" id="authToken" placeholder="Your auth token" required>
                </div>
                <div class="form-group">
                    <label for="phoneNumber">Twilio Phone Number</label>
                    <input type="tel" id="phoneNumber" placeholder="+1234567890" required>
                </div>
                <button type="submit" class="btn btn-primary">Initialize</button>
            </form>
            <div id="setup-status"></div>
        </div>
    </div>

    <!-- Main Phone Screen -->
    <div id="phone-screen" class="screen hidden">
        <div class="container">
            <h1>📞 Browser Phone</h1>

            <!-- Status Display -->
            <div id="status" class="status">Connecting...</div>

            <!-- Idle State: Make a call -->
            <div id="idle-state" class="state">
                <div class="phone-display">
                    <input type="text" id="phone-input" placeholder="Enter phone number" class="phone-number-input">
                </div>

                <div class="dialpad">
                    <button class="dial-btn" data-digit="1">1</button>
                    <button class="dial-btn" data-digit="2">2<span>ABC</span></button>
                    <button class="dial-btn" data-digit="3">3<span>DEF</span></button>
                    <button class="dial-btn" data-digit="4">4<span>GHI</span></button>
                    <button class="dial-btn" data-digit="5">5<span>JKL</span></button>
                    <button class="dial-btn" data-digit="6">6<span>MNO</span></button>
                    <button class="dial-btn" data-digit="7">7<span>PQRS</span></button>
                    <button class="dial-btn" data-digit="8">8<span>TUV</span></button>
                    <button class="dial-btn" data-digit="9">9<span>WXYZ</span></button>
                    <button class="dial-btn" data-digit="*">*</button>
                    <button class="dial-btn" data-digit="0">0<span>+</span></button>
                    <button class="dial-btn" data-digit="#">#</button>
                </div>

                <div class="action-buttons">
                    <button id="call-btn" class="btn btn-call">📞 Call</button>
                </div>
            </div>

            <!-- Incoming Call State -->
            <div id="incoming-state" class="state hidden">
                <div class="incoming-call">
                    <div class="caller-info">
                        <div class="caller-label">Incoming Call</div>
                        <div id="caller-number" class="caller-number">Unknown</div>
                    </div>
                    <div class="incoming-actions">
                        <button id="answer-btn" class="btn btn-answer">✓ Answer</button>
                        <button id="reject-btn" class="btn btn-reject">✗ Reject</button>
                    </div>
                </div>
            </div>

            <!-- Active Call State -->
            <div id="active-state" class="state hidden">
                <div class="call-info">
                    <div class="call-status">Call In Progress</div>
                    <div id="active-number" class="active-number">+1234567890</div>
                    <div id="call-timer" class="call-timer">00:00</div>
                </div>

                <div class="dialpad dialpad-small">
                    <button class="dial-btn-small" data-digit="1">1</button>
                    <button class="dial-btn-small" data-digit="2">2</button>
                    <button class="dial-btn-small" data-digit="3">3</button>
                    <button class="dial-btn-small" data-digit="4">4</button>
                    <button class="dial-btn-small" data-digit="5">5</button>
                    <button class="dial-btn-small" data-digit="6">6</button>
                    <button class="dial-btn-small" data-digit="7">7</button>
                    <button class="dial-btn-small" data-digit="8">8</button>
                    <button class="dial-btn-small" data-digit="9">9</button>
                    <button class="dial-btn-small" data-digit="*">*</button>
                    <button class="dial-btn-small" data-digit="0">0</button>
                    <button class="dial-btn-small" data-digit="#">#</button>
                </div>

                <div class="call-controls">
                    <button id="mute-btn" class="btn btn-control">🔇 Mute</button>
                    <button id="hangup-btn" class="btn btn-hangup">📞 Hang Up</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Twilio Voice SDK 2.x -->
    <script src="https://sdk.twilio.com/js/voice-sdk/releases/2.11.1/twilio.min.js"></script>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Number Management - Twilio Manager</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .numbers-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .numbers-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .numbers-header h1 {
            color: #333;
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .wizard-complete-banner {
            background: #e3f2fd;
            border: 1px solid #2196f3;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .wizard-complete-banner h3 {
            color: #1976d2;
            margin: 0 0 5px 0;
        }

        .wizard-complete-banner p {
            color: #666;
            margin: 0;
            font-size: 14px;
        }

        .config-info-panel {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .config-info-panel h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 18px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 10px 20px;
            font-size: 14px;
        }

        .config-label {
            font-weight: 600;
            color: #666;
        }

        .config-value {
            color: #333;
            word-break: break-all;
            font-family: 'Monaco', 'Courier New', monospace;
            background: white;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .config-value.empty {
            color: #999;
            font-style: italic;
            font-family: inherit;
        }

        .add-number-section {
            margin-bottom: 30px;
        }

        .add-number-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-number-btn:hover {
            background: #5568d3;
        }

        .numbers-list {
            margin-top: 20px;
        }

        .number-card {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .number-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .number-info h3 {
            color: #333;
            margin: 0 0 5px 0;
            font-size: 20px;
        }

        .number-info .friendly-name {
            color: #666;
            font-size: 14px;
        }

        .number-badges {
            display: flex;
            gap: 10px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-configured {
            background: #c8e6c9;
            color: #388e3c;
        }

        .badge-not-configured {
            background: #fff3cd;
            color: #856404;
        }

        .badge-issues {
            background: #f8d7da;
            color: #721c24;
        }

        .validation-issues {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .validation-issues h4 {
            color: #856404;
            margin: 0 0 10px 0;
            font-size: 14px;
        }

        .validation-issues ul {
            margin: 0;
            padding-left: 20px;
            color: #666;
            font-size: 13px;
        }

        .validation-issues li {
            margin-bottom: 5px;
        }

        .number-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-configure {
            background: #667eea;
            color: white;
        }

        .btn-configure:hover {
            background: #5568d3;
        }

        .btn-fix {
            background: #f59e0b;
            color: white;
        }

        .btn-fix:hover {
            background: #d97706;
        }

        .btn-validate {
            background: #10b981;
            color: white;
        }

        .btn-validate:hover {
            background: #059669;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message-box {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .message-error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }

        .message-success {
            background: #efe;
            color: #060;
            border: 1px solid #cfc;
        }

        .message-info {
            background: #eef;
            color: #006;
            border: 1px solid #ccf;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .phone-number-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .phone-number-option {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .phone-number-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .phone-number-option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .modal-cancel {
            background: #e0e0e0;
            color: #333;
        }

        .modal-confirm {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="numbers-container">
        <div class="numbers-header">
            <h1>📱 Phone Number Management</h1>
            <div class="nav-links">
                <a href="/messages.html">💬 Messages</a>
                <a href="/setup.html">⚙️ Setup</a>
                <a href="/debug">🐛 Debug</a>
                <a href="/">📞 Phone</a>
            </div>
        </div>

        <div id="wizard-banner"></div>
        <div id="config-info"></div>
        <div id="message-box"></div>

        <div class="add-number-section">
            <button class="add-number-btn" id="add-number-btn">+ Add Phone Number</button>
            <button class="add-number-btn" style="background: #10b981; margin-left: 10px;" id="validate-all-btn">🔍 Validate All</button>
            <button class="add-number-btn" style="background: #6b7280; margin-left: 10px;" id="refresh-btn">🔄 Refresh</button>
        </div>

        <div id="numbers-list" class="numbers-list">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading phone numbers...</p>
            </div>
        </div>
    </div>

    <!-- Add Number Modal -->
    <div class="modal" id="add-number-modal">
        <div class="modal-content">
            <h2>Add Phone Number from Twilio</h2>
            <p style="color: #666; margin-bottom: 20px;">
                Select a phone number from your Twilio account to import and configure.
            </p>
            <div id="modal-message"></div>
            <div id="available-numbers" class="phone-number-list">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading available numbers...</p>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="modal-cancel" id="modal-cancel-btn">Cancel</button>
                <button class="modal-confirm" id="import-btn" disabled>Import Number</button>
            </div>
        </div>
    </div>

    <script>
        let selectedNumber = null;
        let phoneNumbers = [];

        /**
         * HTML escape function to prevent XSS attacks
         * Escapes <, >, &, ", ' characters
         */
        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return String(unsafe)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        /**
         * Load and display configuration information
         * Shows webhook URLs and TwiML app names
         */
        async function loadConfigInfo() {
            const configDiv = document.getElementById('config-info');
            try {
                const response = await fetch('/api/config-info');
                const data = await response.json();

                if (response.ok && data.configured) {
                    configDiv.innerHTML = `
                        <div class="config-info-panel">
                            <h3>Current Configuration</h3>
                            <div class="config-grid">
                                <div class="config-label">TwiML App Name:</div>
                                <div class="config-value ${!data.twiml_app_name ? 'empty' : ''}">${escapeHtml(data.twiml_app_name || 'N/A')}</div>

                                <div class="config-label">TwiML App SID:</div>
                                <div class="config-value ${!data.twiml_app_sid ? 'empty' : ''}">${escapeHtml(data.twiml_app_sid || 'N/A')}</div>

                                <div class="config-label">Voice Webhook:</div>
                                <div class="config-value ${!data.voice_url ? 'empty' : ''}">${escapeHtml(data.voice_url || 'N/A')}</div>

                                <div class="config-label">Status Callback:</div>
                                <div class="config-value ${!data.status_callback ? 'empty' : ''}">${escapeHtml(data.status_callback || 'N/A')}</div>

                                <div class="config-label">SMS Webhook:</div>
                                <div class="config-value ${!data.sms_url ? 'empty' : ''}">${escapeHtml(data.sms_url || 'N/A')}</div>

                                <div class="config-label">SMS Status Callback:</div>
                                <div class="config-value ${!data.sms_status_callback ? 'empty' : ''}">${escapeHtml(data.sms_status_callback || 'N/A')}</div>
                            </div>
                        </div>
                    `;
                } else {
                    // Don't show anything if not configured
                    configDiv.innerHTML = '';
                }
            } catch (error) {
                console.error('Failed to load config info:', error);
                configDiv.innerHTML = '';
            }
        }

        // Rate limiting for validation (prevent spam)
        let lastValidateTime = 0;
        const VALIDATE_COOLDOWN_MS = 10000; // 10 seconds between validations

        // Check for wizard completion query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const wizardComplete = urlParams.get('wizard');

        if (wizardComplete === 'voice') {
            document.getElementById('wizard-banner').innerHTML = `
                <div class="wizard-complete-banner">
                    <h3>✅ Voice Setup Complete!</h3>
                    <p>Your TwiML application and API keys have been configured. Now add phone numbers below to start making calls.</p>
                </div>
            `;
        } else if (wizardComplete === 'sms') {
            document.getElementById('wizard-banner').innerHTML = `
                <div class="wizard-complete-banner">
                    <h3>✅ SMS Setup Complete!</h3>
                    <p>Your account is now configured for SMS messaging. Add phone numbers below and configure them for SMS to start sending and receiving messages.</p>
                </div>
            `;
        }

        async function loadPhoneNumbers() {
            const listDiv = document.getElementById('numbers-list');

            try {
                const response = await fetch('/api/numbers');
                const data = await response.json();

                if (response.ok) {
                    phoneNumbers = data.numbers || [];

                    if (phoneNumbers.length === 0) {
                        listDiv.innerHTML = `
                            <div class="empty-state">
                                <h2>No Phone Numbers Yet</h2>
                                <p>Click "Add Phone Number" above to import numbers from your Twilio account.</p>
                            </div>
                        `;
                    } else {
                        renderPhoneNumbers();
                    }
                } else {
                    listDiv.innerHTML = `<div class="message-box message-error">Failed to load phone numbers: ${data.error}</div>`;
                }
            } catch (error) {
                listDiv.innerHTML = `<div class="message-box message-error">Error loading phone numbers: ${error.message}</div>`;
            }
        }

        function renderPhoneNumbers() {
            const listDiv = document.getElementById('numbers-list');

            listDiv.innerHTML = phoneNumbers.map(number => {
                const voiceStatus = getVoiceStatus(number);
                const smsStatus = getSMSStatus(number);
                const voiceIssues = getVoiceIssues(number);
                const smsIssues = getSMSIssues(number);

                // Escape all issues to prevent XSS
                let issuesHtml = '';
                if (voiceIssues.length > 0 || smsIssues.length > 0) {
                    issuesHtml = `
                        <div class="validation-issues">
                            <h4>⚠️ Configuration Issues:</h4>
                            <ul>
                                ${voiceIssues.map(issue => `<li>${escapeHtml(issue)}</li>`).join('')}
                                ${smsIssues.map(issue => `<li>${escapeHtml(issue)}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }

                // Use data attributes instead of inline onclick for security
                return `
                    <div class="number-card" data-sid="${escapeHtml(number.sid)}" data-phone="${escapeHtml(number.phone_number)}">
                        <div class="number-card-header">
                            <div class="number-info">
                                <h3>${escapeHtml(number.phone_number)}</h3>
                                ${number.friendly_name ? `<div class="friendly-name">${escapeHtml(number.friendly_name)}</div>` : ''}
                            </div>
                            <div class="number-badges">
                                <span class="status-badge ${voiceStatus.class}">Voice: ${escapeHtml(voiceStatus.label)}</span>
                                <span class="status-badge ${smsStatus.class}">SMS: ${escapeHtml(smsStatus.label)}</span>
                            </div>
                        </div>
                        ${issuesHtml}
                        <div class="number-actions">
                            ${voiceStatus.status === 'not-configured' ? `<button class="btn-small btn-configure" data-action="configure-voice">Configure Voice</button>` : ''}
                            ${voiceStatus.status === 'issues' ? `<button class="btn-small btn-fix" data-action="fix-voice">Fix Voice</button>` : ''}
                            ${smsStatus.status === 'not-configured' ? `<button class="btn-small btn-configure" data-action="configure-sms">Configure SMS</button>` : ''}
                            ${smsStatus.status === 'issues' ? `<button class="btn-small btn-fix" data-action="fix-sms">Fix SMS</button>` : ''}
                            <button class="btn-small btn-validate" data-action="validate">Validate</button>
                            <button class="btn-small btn-delete" data-action="delete">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');

            // Add event delegation for number card buttons
            listDiv.querySelectorAll('.number-card').forEach(card => {
                const sid = card.getAttribute('data-sid');
                const phoneNumber = card.getAttribute('data-phone');

                card.querySelectorAll('button[data-action]').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const action = this.getAttribute('data-action');

                        switch(action) {
                            case 'configure-voice':
                                await configureVoice(sid);
                                break;
                            case 'fix-voice':
                                await fixVoice(sid);
                                break;
                            case 'configure-sms':
                                await configureSMS(sid);
                                break;
                            case 'fix-sms':
                                await fixSMS(sid);
                                break;
                            case 'validate':
                                await validateNumber(sid);
                                break;
                            case 'delete':
                                await deleteNumber(sid, phoneNumber);
                                break;
                        }
                    });
                });
            });
        }

        function getVoiceStatus(number) {
            if (!number.voice_config || !number.voice_config.webhook_configured) {
                return { status: 'not-configured', label: 'Not Configured', class: 'badge-not-configured' };
            }

            const issues = getVoiceIssues(number);
            if (issues.length > 0) {
                return { status: 'issues', label: 'Issues', class: 'badge-issues' };
            }

            return { status: 'configured', label: 'Configured', class: 'badge-configured' };
        }

        function getSMSStatus(number) {
            if (!number.sms_config || !number.sms_config.webhook_configured) {
                return { status: 'not-configured', label: 'Not Configured', class: 'badge-not-configured' };
            }

            const issues = getSMSIssues(number);
            if (issues.length > 0) {
                return { status: 'issues', label: 'Issues', class: 'badge-issues' };
            }

            return { status: 'configured', label: 'Configured', class: 'badge-configured' };
        }

        function getVoiceIssues(number) {
            const issues = [];
            // Validation logic will be implemented on backend
            if (number.voice_config && number.voice_config.issues) {
                return number.voice_config.issues;
            }
            return issues;
        }

        function getSMSIssues(number) {
            const issues = [];
            // Validation logic will be implemented on backend
            if (number.sms_config && number.sms_config.issues) {
                return number.sms_config.issues;
            }
            return issues;
        }

        async function showAddNumberModal() {
            document.getElementById('add-number-modal').classList.add('active');
            await loadAvailableNumbers();
        }

        function hideAddNumberModal() {
            document.getElementById('add-number-modal').classList.remove('active');
            selectedNumber = null;
        }

        async function loadAvailableNumbers() {
            const listDiv = document.getElementById('available-numbers');
            const modalMessage = document.getElementById('modal-message');

            try {
                const response = await fetch('/api/twilio/phone-numbers');
                const data = await response.json();

                if (response.ok && data.numbers && data.numbers.length > 0) {
                    // Escape all user content and use data attributes instead of inline onclick
                    listDiv.innerHTML = data.numbers.map(number => `
                        <div class="phone-number-option"
                             data-sid="${escapeHtml(number.sid)}"
                             data-phone="${escapeHtml(number.phoneNumber)}"
                             data-friendly="${escapeHtml(number.friendlyName || '')}">
                            <label style="cursor: pointer; display: block;">
                                <input type="radio" name="phone-number" value="${escapeHtml(number.sid)}">
                                <strong>${escapeHtml(number.phoneNumber)}</strong>
                                ${number.friendlyName ? `<br><small style="color: #666;">${escapeHtml(number.friendlyName)}</small>` : ''}
                                <br><small style="color: #999;">Voice: ${number.capabilities.voice ? '✓' : '✗'} | SMS: ${number.capabilities.SMS ? '✓' : '✗'} | MMS: ${number.capabilities.MMS ? '✓' : '✗'}</small>
                            </label>
                        </div>
                    `).join('');

                    // Add event listeners to phone number options
                    listDiv.querySelectorAll('.phone-number-option').forEach(option => {
                        option.addEventListener('click', function() {
                            const sid = this.getAttribute('data-sid');
                            const phoneNumber = this.getAttribute('data-phone');
                            const friendlyName = this.getAttribute('data-friendly');
                            selectNumber(sid, phoneNumber, friendlyName);
                        });
                    });
                } else {
                    modalMessage.innerHTML = '<div class="message-box message-error">No phone numbers found in your Twilio account.</div>';
                    listDiv.innerHTML = '';
                }
            } catch (error) {
                modalMessage.innerHTML = `<div class="message-box message-error">Failed to load numbers: ${escapeHtml(error.message)}</div>`;
            }
        }

        function selectNumber(sid, phoneNumber, friendlyName) {
            document.querySelectorAll('.phone-number-option').forEach(el => el.classList.remove('selected'));

            // Find and mark the option as selected
            const options = document.querySelectorAll('.phone-number-option');
            options.forEach(opt => {
                if (opt.getAttribute('data-sid') === sid) {
                    opt.classList.add('selected');
                }
            });

            selectedNumber = { sid, phoneNumber, friendlyName };
            document.getElementById('import-btn').disabled = false;
        }

        async function importNumber() {
            if (!selectedNumber) return;

            const messageDiv = document.getElementById('modal-message');
            messageDiv.innerHTML = '<div class="message-box message-info">Importing number...</div>';

            try {
                const response = await fetch('/api/numbers/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(selectedNumber)
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.innerHTML = '<div class="message-box message-success">Number imported successfully!</div>';
                    setTimeout(() => {
                        hideAddNumberModal();
                        loadPhoneNumbers();
                    }, 1000);
                } else {
                    messageDiv.innerHTML = `<div class="message-box message-error">Failed to import: ${data.error}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="message-box message-error">Error: ${error.message}</div>`;
            }
        }

        async function configureVoice(sid) {
            await performAction(`/api/numbers/${sid}/configure-voice`, 'Configuring voice...');
        }

        async function configureSMS(sid) {
            await performAction(`/api/numbers/${sid}/configure-sms`, 'Configuring SMS...');
        }

        async function fixVoice(sid) {
            await performAction(`/api/numbers/${sid}/fix-voice`, 'Fixing voice configuration...');
        }

        async function fixSMS(sid) {
            await performAction(`/api/numbers/${sid}/fix-sms`, 'Fixing SMS configuration...');
        }

        async function validateNumber(sid) {
            await performAction(`/api/numbers/${sid}/validate`, 'Validating number...');
        }

        async function validateAllNumbers() {
            // Rate limiting to prevent spam
            const now = Date.now();
            if (now - lastValidateTime < VALIDATE_COOLDOWN_MS) {
                const waitSeconds = Math.ceil((VALIDATE_COOLDOWN_MS - (now - lastValidateTime)) / 1000);
                document.getElementById('message-box').innerHTML =
                    `<div class="message-box message-error">Please wait ${waitSeconds} seconds before validating again</div>`;
                setTimeout(() => {
                    document.getElementById('message-box').innerHTML = '';
                }, 2000);
                return;
            }
            lastValidateTime = now;

            await performAction('/api/numbers/validate-all', 'Validating all numbers...');
        }

        async function deleteNumber(sid, phoneNumber) {
            if (!confirm(`Are you sure you want to remove ${phoneNumber} from your configuration?`)) {
                return;
            }

            await performAction(`/api/numbers/${sid}`, 'Deleting number...', 'DELETE');
        }

        async function performAction(url, loadingMessage, method = 'POST') {
            const messageBox = document.getElementById('message-box');
            messageBox.innerHTML = `<div class="message-box message-info">${loadingMessage}</div>`;

            try {
                const response = await fetch(url, { method });
                const data = await response.json();

                if (response.ok) {
                    messageBox.innerHTML = `<div class="message-box message-success">${data.message || 'Action completed successfully'}</div>`;
                    setTimeout(() => {
                        messageBox.innerHTML = '';
                    }, 3000);
                    await loadPhoneNumbers();
                } else {
                    messageBox.innerHTML = `<div class="message-box message-error">Error: ${data.error}</div>`;
                }
            } catch (error) {
                messageBox.innerHTML = `<div class="message-box message-error">Error: ${error.message}</div>`;
            }
        }

        async function refreshFromTwilio() {
            const messageBox = document.getElementById('message-box');
            messageBox.innerHTML = '<div class="message-box message-info">Refreshing from Twilio...</div>';

            await validateAllNumbers();

            setTimeout(() => {
                messageBox.innerHTML = '';
            }, 2000);
        }

        // Auto-validate numbers on first load
        let hasAutoValidated = false;

        async function autoValidateNumbers() {
            if (hasAutoValidated || phoneNumbers.length === 0) return;
            hasAutoValidated = true;

            // Wait a moment then auto-validate
            setTimeout(async () => {
                await validateAllNumbers();
            }, 1000);
        }

        // Initialize page and add event listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Add event listeners for main buttons
            document.getElementById('add-number-btn').addEventListener('click', showAddNumberModal);
            document.getElementById('validate-all-btn').addEventListener('click', validateAllNumbers);
            document.getElementById('refresh-btn').addEventListener('click', refreshFromTwilio);

            // Add event listeners for modal buttons
            document.getElementById('modal-cancel-btn').addEventListener('click', hideAddNumberModal);
            document.getElementById('import-btn').addEventListener('click', importNumber);
        });

        // Load phone numbers and config info on page load
        loadPhoneNumbers().then(() => {
            loadConfigInfo();
            autoValidateNumbers();
        });
    </script>
</body>
</html>
